services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/mydatabase
    depends_on:
      - mymongo
    volumes:
      - ./backend:/app
      - /app/node_modules 
    networks:
      - taw

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    depends_on:
      - backend
    volumes:
      - ./frontend/postmessagesweb:/app
      - /app/node_modules 
    networks:
      - taw

  mymongo:
    image: mongo:6
    volumes:
      - mongodb-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - taw

networks:
  taw:
    name: taw
    driver: bridge

volumes:
  mongodb-data:
