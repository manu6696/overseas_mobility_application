
<h2 mat-dialog-title>Documento Agreement</h2>

<mat-dialog-content style="height: 70vh; min-height: 500px; width: 100%; padding: 0; overflow: hidden;">
  <embed 
    *ngIf="safePdfUrl" 
    [src]="safePdfUrl" 
    type="application/pdf" 
    width="100%" 
    height="100%" 
    style="min-height: 500px; border: none;" />
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Chiudi</button>
</mat-dialog-actions>
