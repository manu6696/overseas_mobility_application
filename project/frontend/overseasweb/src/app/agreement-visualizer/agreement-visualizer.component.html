<h2 mat-dialog-title>Learning Agreement</h2>

<mat-dialog-content class="custom-dialog-content">

  <div *ngIf="agreements && agreements.length > 0; else noAgreements">
    <div class="agreement-item" *ngFor="let ag of agreements">

      <div class="agreement-header">
        <span class="agreement-date">Uploaded on {{ ag.uploadDate | date:'dd/MM/yyyy' }}</span>
        <span class="status-badge" [ngClass]="getStatusClass(ag.approved)">{{ ag.approved }}</span>
      </div>

      <p class="agreement-description">{{ ag.modifyDescription }}</p>

      <div class="agreement-decision" *ngIf="ag.decisionDate">
        <span>Decisione del {{ ag.decisionDate | date:'dd/MM/yyyy' }}</span>
        <span *ngIf="ag.lecturerReason"> — {{ ag.lecturerReason }}</span>
      </div>

      <button mat-fab extended color="primary" (click)="viewAgreement(ag._id)">
        <mat-icon>picture_as_pdf</mat-icon>
        PDF
      </button>

    </div>
  </div>

  <ng-template #noAgreements>
    <p>No Learning Agreement uploaded for this application.</p>
  </ng-template>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
