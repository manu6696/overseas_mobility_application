<mat-toolbar class="cf-toolbar">

  <div class="logo-box">
    <div class="cf-title">
      <span>Overseas</span>
      <span>Mobility</span>
      <span>Application</span>
    </div>
  </div>

  <nav class="cf-nav">
    
    
    <a *ngIf="isLecturer" routerLink="/dashboard-lecturer" routerLinkActive="active-link" class="home-link">Home</a>
    <a *ngIf="isStudent" routerLink="/dashboard-student" routerLinkActive="active-link" class="home-link">Home</a>
    <a *ngIf="isStaff" routerLink="/dashboard-staff" routerLinkActive="active-link" class="home-link">Home</a>
    <a routerLink="/history-tab" routerLinkActive="active-link" class="history-link">History</a>

  </nav>

  <span class="spacer"></span>

  <button mat-button [matMenuTriggerFor]="userMenu" class="user-chip">
    <span class="avatar-circle">{{ getInitials() }}</span>
    <mat-icon>expand_more</mat-icon>
  </button>

  <mat-menu #userMenu="matMenu">
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>

</mat-toolbar>
