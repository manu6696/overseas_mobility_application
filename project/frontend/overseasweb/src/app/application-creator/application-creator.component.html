
<h2 mat-dialog-title>Application Creation</h2>

<!-------- GENERAL ---------->
<mat-dialog-content class="custom-dialog-content">
  <div *ngIf="data.application" class="form-container">
    
    <!-------- GENERAL GROUPS ---------->
    <ng-container *ngFor="let fieldGroupResult of fieldGroupEdited">
      <div *ngIf="fieldGroupResult.groupLabel !== 'Courses'" class="group-section">
        <h3 class="group-title">{{ fieldGroupResult.groupLabel }}</h3>
        



        <div class="fields-grid">

          <!--
          <mat-form-field *ngFor="let field of fieldGroupResult.fields" appearance="outline" density="compact">
              <mat-label>{{ field.name }}</mat-label>
              <input matInput [disabled] ="!field.isEditable" [(ngModel)]="data.application[field.key]"/>           
          </mat-form-field>


        -->
          <ng-container *ngFor="let field of fieldGroupResult.fields">

            <ng-container *ngIf="field.name !== 'Upload Date' && field.name !== 'Lecturer Reason'">

                <!-- GENERAL FIELDS -->
                <mat-form-field *ngIf="field.name !== 'Hosting Institution'; else hostingBlock" 
                                appearance="outline" 
                                density="compact">
                <mat-label>{{ field.name }}</mat-label>
                <input matInput [(ngModel)]="data.application[field.key]"/>
                </mat-form-field>

                <!-- HOSTING INSTITUTION -->
                <ng-template #hostingBlock>
                <mat-form-field appearance="outline" density="compact">
                    <mat-label>{{ field.name }}</mat-label>

                    <mat-select (selectionChange)="onHostChange($event)" [(ngModel)]="data.application[field.key]">
                    
                    <mat-option *ngFor="let host of hosts" [value]="host.name">
                        {{ host.name }} — {{ host.city }} ({{ host.country }})
                    </mat-option>
                    
                    </mat-select>
                </mat-form-field>
                </ng-template>
            </ng-container>
            




          </ng-container>


        </div>
      </div>
    </ng-container>

    <div class="group-section courses-section">
      <h3 class="group-title courses-title">Courses</h3>

      <div *ngFor="let ce of data.application.courses;let itemNumber = count; let isLast = last; let courseIndex = index" class="course-comparison-row">
        
        <!-------- ORIGINAL COURSE ---------->
        <div class="course-column">
          <div class="course-subtitle">Original Course</div>
          <div class="course-inputs">
            <mat-form-field appearance="outline" density="compact" class="field-code">
              <mat-label>Code</mat-label>
              <input matInput [(ngModel)]="ce.originalCourse.code"/>
            </mat-form-field>

            <mat-form-field appearance="outline" density="compact" class="field-title">
              <mat-label>Course Title</mat-label>
              <input matInput [(ngModel)]="ce.originalCourse.title"/>
            </mat-form-field>

            <mat-form-field appearance="outline" density="compact" class="field-cfu">
              <mat-label>CFU</mat-label>
              <input matInput [(ngModel)]="ce.originalCourse.credits"/>
            </mat-form-field>
          </div>
        </div>

        <!-------- ARROW ---------->
        <div class="arrow-wrapper">
          <span class="arrow">→</span>
        </div>

        <!-------- EQUIVALENT COURSE ---------->
        <div class="course-column">
          <div class="course-subtitle">Equivalent Course</div>
          <div class="course-inputs">
            <mat-form-field appearance="outline" density="compact" class="field-code">
              <mat-label>Code</mat-label>
              <input matInput [(ngModel)]="ce.equivalentCourse.code"/>
            </mat-form-field>

            <mat-form-field appearance="outline" density="compact" class="field-title">
              <mat-label>Course Title</mat-label>
              <input matInput [(ngModel)]="ce.equivalentCourse.title"/>
            </mat-form-field>

            <mat-form-field appearance="outline" density="compact" class="field-cfu">
              <mat-label>CFU</mat-label>
              <input matInput [(ngModel)]="ce.equivalentCourse.credits"/>
            </mat-form-field>
          </div>
        </div>

        <!-------- DELETE BUTTON ---------->
        <button type="button" 
                mat-mini-fab 
                color="primary" 
                class="delete-button" 
                (click)="deleteCourseSection(data.application, courseIndex)"
                aria-label="Delete course">                
          <mat-icon>delete</mat-icon>
        </button>

        <!-------- PLUS BUTTON ---------->
        <button *ngIf="isLast || itemNumber == 0 " 
                type="button" 
                mat-mini-fab 
                color="primary" 
                class="add-button" 
                (click)="addCourseSection(data.application)"
                aria-label="Add course">                
          <mat-icon>add</mat-icon>
        </button>

      </div>


        <!-------- PLUS BUTTON IF EMPTY LIST ---------->
        <button *ngIf="data.application.courses.length == 0 " 
                type="button" 
                mat-mini-fab 
                color="primary" 
                class="add-button-if-empty" 
                (click)="addCourseSection(data.application)"
                aria-label="Add course">                
          <mat-icon>add</mat-icon>
        </button>

    </div>

  </div>
</mat-dialog-content>

<!-------- EDITOR BUTTONS ---------->
<mat-dialog-actions align="end">
  <button mat-flat-button  class="close-button" mat-dialog-close>Close</button>
  <button mat-flat-button color="primary" class="edit-button" [mat-dialog-close]="data.application" (click)="applicationSubmition()" cdkFocusInitial>Submit</button>
</mat-dialog-actions>
