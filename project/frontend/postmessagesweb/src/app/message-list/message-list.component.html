
<app-message-editor (posted)="get_messages()" ></app-message-editor>

<div *ngFor="let message of messages" class="card" style="margin: 5px" > 
    <div class="card-body">
        <h5 class="card-title"><i class="far fa-envelope"></i>&nbsp;{{message.authormail}}</h5>        
        <h6 class="card-subtitle mb-2 text-muted">{{message.timestamp | date}} / {{message.timestamp | date:'shortTime'}}</h6>
        <p class="card-text">{{ message.content }}</p>
        <span *ngFor="let tag of message.tags" class="badge bg-secondary tag">#{{tag}}</span>
    </div>
</div>


<div class="fixed-bottom p-2 text-white bg-dark">
    <div class="dropdown d-flex justify-content-end">
        <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            {{us.get_username()}}
        </button>
        <ul class="dropdown-menu">
            <div class="dropdown-item" href="#">{{us.get_mail()}}</div>
            <div *ngIf="us.is_admin()" class="dropdown-item" href="#"><i class="fas fa-check"></i> Admin role</div>
            <div *ngIf="us.is_moderator()" class="dropdown-item" href="#"><i class="fas fa-check"></i> Moderator role
            </div>
            <div class="dropdown-divider"></div>
            <div class="dropdown-item"> <a class="nav-link" (click)="logout()">Logout</a></div>
        </ul>
    </div>
</div>
