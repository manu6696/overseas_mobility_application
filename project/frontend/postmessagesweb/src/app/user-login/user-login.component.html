<div class="container" style="width: 400px; margin-top: 20px;" >
  <div class="form-signin text-center loginform ">

    <img src="assets/logo-cafoscari.svg" alt="Università Ca' Foscari Venezia" class="mb-3" style="max-width: 260px; height: auto;">

    <h1 class="h3 mb-0 font-weight-bold" style="font-size: 1.5rem;">Overseas mobility program</h1>
    <h2 class="h3 mb-3 font-weight-normal" style="font-size: 1.2rem;">Please sign in</h2>

    <label for="inputEmail" class="sr-only">Email address</label>
    <input type="email" #mailtxt id="inputEmail" class="form-control" placeholder="Email address" required autofocus>
    
    <label for="inputPassword" class="sr-only">Password</label>
    <input type="password" #passwdtxt id="inputPassword" class="form-control" placeholder="Password" required>
    
    <div class="checkbox mb-3">
      <label>
        <input type="checkbox" #checkr value="remember-me"> Remember me
      </label>
    </div>
    
    <div *ngIf="errmessage" class="alert alert-danger" role="alert">\
      Login error: {{errmessage}}
    </div>
    
    <button class="btn btn-lg btn-primary btn-block" (click)="login( mailtxt.value, passwdtxt.value, checkr.checked );" >Sign in</button>
    <p><a routerLink="/signup">Sign-up new user</a></p>
    
    <p class="mt-5 mb-3 text-muted">&copy; 2017-2026 / Web Applications and Technologies</p>
  </div>
</div>
